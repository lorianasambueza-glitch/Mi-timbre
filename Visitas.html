<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitas - LS Impresiones</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f2f8;
      color: #222;
      padding: 20px;
    }

    .contenedor {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
      font-size: 34px;
    }

    .subtitulo {
      text-align: center;
      color: #777;
      font-size: 20px;
      margin-bottom: 30px;
    }

    .mensaje {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .nombre {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .dato {
      font-size: 18px;
      margin: 8px 0;
    }

    .fecha {
      font-size: 15px;
      color: #888;
      margin-top: 10px;
    }

    .vacio {
      text-align: center;
      color: #777;
      margin-top: 40px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>📬 Visitas</h1>
    <div class="subtitulo">LS Impresiones</div>

    <div id="lista">
      <div class="vacio">Cargando mensajes...</div>
    </div>

  </div>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      get
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDLL-cg2ihlkIzYxKBWZ525_SC_zGHEwww",
      authDomain: "mi-timbre-23084.firebaseapp.com",
      databaseURL: "https://mi-timbre-23084-default-rtdb.firebaseio.com",
      projectId: "mi-timbre-23084",
      storageBucket: "mi-timbre-23084.firebasestorage.app",
      messagingSenderId: "785685035859",
      appId: "1:785685035859:web:f9c28b50a6ba17630ebfa6"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const database = getDatabase(app);


    async function iniciar() {

      const lista =
        document.getElementById("lista");

      try {

        await signInAnonymously(auth);

        const referencia =
          ref(database, "mensajes");

        const snapshot =
          await get(referencia);


        if (!snapshot.exists()) {

          lista.innerHTML =
            '<div class="vacio">No hay mensajes todavía.</div>';

          return;
        }


        const datos =
          snapshot.val();

        const mensajes =
          Object.values(datos).reverse();

        lista.innerHTML = "";


        mensajes.forEach(m => {

          const tarjeta =
            document.createElement("div");

          tarjeta.className =
            "mensaje";


          const nombre =
            document.createElement("div");

          nombre.className =
            "nombre";

          nombre.textContent =
            "👤 " +
            (m.nombre || "Sin nombre");


          const contacto =
            document.createElement("div");

          contacto.className =
            "dato";

          contacto.textContent =
            "📱 " +
            (m.contacto || "Sin contacto");


          const motivo =
            document.createElement("div");

          motivo.className =
            "dato";

          motivo.textContent =
            "💬 " +
            (m.motivo || "Sin mensaje");


          const fecha =
            document.createElement("div");

          fecha.className =
            "fecha";

          fecha.textContent =
            "🕒 " +
            (m.fechaHora || "Sin fecha");


          tarjeta.appendChild(nombre);
          tarjeta.appendChild(contacto);
          tarjeta.appendChild(motivo);
          tarjeta.appendChild(fecha);

          lista.appendChild(tarjeta);

        });


      } catch (error) {

        console.error(error);

        lista.innerHTML =
          '<div class="vacio">⚠️ No se pudieron cargar los mensajes.</div>';

      }

    }


    iniciar();

  </script>

</body>
</html>

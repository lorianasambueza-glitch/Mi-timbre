<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timbre virtual</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      width: 90%;
      max-width: 380px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 18px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #mensaje {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #2e7d32;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🔔 Timbre</h1>
    <p>¿Estás afuera?</p>
    <button onclick="tocarTimbre()">🔔 TOCAR TIMBRE</button>
    <div id="mensaje"></div>
  </div>

  <script>
    function tocarTimbre() {
      fetch("https://ntfy.sh/timbre-loly-Nqn-84726-XP", {
        method: "POST",
        body: "🔔 Hay alguien en la puerta"
      })
      .then(() => {
        document.getElementById("mensaje").innerText =
          "✓ Listo, ya avisamos que estás afuera";
      })
      .catch(() => {
        document.getElementById("mensaje").innerText =
          "No se pudo enviar el aviso. Intentá nuevamente.";
      });
    }
  </script>
</body>
</html>
